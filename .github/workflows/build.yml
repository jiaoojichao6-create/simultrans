name: Build Simultrans Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE (onedir mode, most reliable for complex apps)
      run: |
        pyinstaller --onedir --windowed --name "Simultrans" `
          --hidden-import PyQt5.sip `
          --hidden-import webrtcvad `
          --hidden-import soundfile `
          --collect-submodules pipeline `
          --collect-submodules audio `
          --collect-submodules utils `
          main.py
        echo "=== Build output ==="
        dir dist\Simultrans

    - name: Compress to zip
      run: |
        cd dist
        powershell Compress-Archive -Path Simultrans -DestinationPath Simultrans.zip
        dir Simultrans.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Simultrans-Windows
        path: dist/Simultrans.zip
        overwrite: true

name: Build Simultrans Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE (onedir mode - fixes torch DLL issue)
      run: |
        pyinstaller --onedir --windowed --name "Simultrans" main.py

    - name: Compress output folder
      run: |
        cd dist
        powershell Compress-Archive -Path Simultrans -DestinationPath Simultrans.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Simultrans-Windows
        path: dist/Simultrans.zip
        overwrite: true

name: Build Simultrans Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "Simultrans" `
          --hidden-import PyQt5.sip `
          --hidden-import pipeline.controller `
          --hidden-import pipeline.vad `
          --hidden-import pipeline.asr `
          --hidden-import pipeline.translator `
          --hidden-import pipeline.tts `
          --hidden-import pipeline.glossary `
          --hidden-import audio.capture `
          --hidden-import audio.playback `
          --hidden-import utils.config `
          --hidden-import webrtcvad `
          --hidden-import soundfile `
          --add-data "audio/*.py;audio" `
          --add-data "pipeline/*.py;pipeline" `
          --add-data "utils/*.py;utils" `
          main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Simultrans-Windows
        path: dist/Simultrans.exe
        overwrite: true
